services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5}
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vazhithirivu}
      POSTGRES_USER: ${POSTGRES_USER:-vazhithirivu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vazhithirivu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: postgis://${POSTGRES_USER:-vazhithirivu}:${POSTGRES_PASSWORD:-vazhithirivu}@db:5432/${POSTGRES_DB:-vazhithirivu}
      # Channel layer + shared cache (ADR-014). Set REDIS_URL to empty in
      # a compose override to run with the in-process fallback instead.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot OSM importer. Run explicitly, never wired into web startup:
  #   docker compose --profile import run --rm osm-import \
  #     --source /data/osm/southern-zone-latest.osm.pbf --bbox 76.18,9.85,76.45,10.15
  osm-import:
    profiles: ["import"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: postgis://${POSTGRES_USER:-vazhithirivu}:${POSTGRES_PASSWORD:-vazhithirivu}@db:5432/${POSTGRES_DB:-vazhithirivu}
    entrypoint: ["python", "manage.py", "import_osm_railways"]
    volumes:
      - .:/app
      - ./data/osm:/data/osm:ro
    depends_on:
      db:
        condition: service_healthy

  # Optional simulator service (ADR-015). The app works without it.
  # Start:  docker compose --profile simulation up -d simulator
  # Then:   docker compose exec web python manage.py simulator start ...
  # Or manual ticks without the service: manage.py simulator tick --n 40
  simulator:
    profiles: ["simulation"]
    build:
      context: .
      args:
        REQUIREMENTS: requirements/dev.txt
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: postgis://${POSTGRES_USER:-vazhithirivu}:${POSTGRES_PASSWORD:-vazhithirivu}@db:5432/${POSTGRES_DB:-vazhithirivu}
      # Redis is how sim ticks reach browsers connected to `web`.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: python manage.py run_simulator
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dev-only Tailwind watcher; recompiles static/css/app.css on file changes.
  # The web app does not depend on it (it serves whatever CSS exists).
  tailwind:
    build:
      context: .
      target: tailwind
    working_dir: /src
    volumes:
      - .:/src
    command: tailwindcss -i assets/tailwind/input.css -o static/css/app.css --watch=always

volumes:
  pgdata:
