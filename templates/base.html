{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>{% block title %}Vazhithirivu{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">
  <a href="#route-panel"
     class="sr-only z-50 rounded-lg bg-white px-4 py-2 text-sm font-medium text-brand-800 shadow-lg focus:not-sr-only focus:absolute focus:left-3 focus:top-3">
    Skip to route panel
  </a>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
