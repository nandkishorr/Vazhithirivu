{% load ui %}
{# Include with: title, body, icon (optional, default inbox) #}
<div class="flex flex-col items-center gap-2 rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-8 text-center">
  <span class="text-slate-400">{% if icon %}{% icon icon class="size-8" %}{% else %}{% icon "inbox" class="size-8" %}{% endif %}</span>
  <p class="text-sm font-medium text-slate-700">{{ title }}</p>
  {% if body %}<p class="max-w-sm text-sm text-slate-500">{{ body }}</p>{% endif %}
  {{ extra }}
</div>
